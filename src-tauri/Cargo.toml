[package]
name = "douyin-history-archive"
version = "0.1.0"
description = "Fy1DouyinArchiver - local Douyin archive desktop app"
authors = ["LifeArchiveProject"]
license = "GPL-3.0-only"
edition = "2021"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-build = { version = "2", features = [] }
walkdir = "2.5"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
bytes = "1"
base64 = "0.22"
futures-util = "0.3.32"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.14.1"
sysinfo = "0.39.6"
url = "2"
uuid = { version = "1", features = ["v4"] }
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
walkdir = "2.5"
